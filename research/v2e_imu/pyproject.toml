[project]
name = "v2e-imu-research"
version = "0.1.0"
description = "IMU-Enhanced Event Camera Research"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "timm>=1.0.26",
    "h5py>=3.10.0",
    "matplotlib>=3.7.0",
    "mlflow>=2.20.0",
    "boto3>=1.34.0",
    "opencv-python",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.0",
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    "tqdm>=4.65.0",
]

[dependency-groups]
dev = []
